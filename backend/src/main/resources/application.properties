spring.application.name=backend
spring.config.import=classpath:heuristic-rules.yml,optional:file:./application-secrets.properties,optional:classpath:application-secrets.properties

# This will default to the environment variable GEMINI_API_KEY if set, 
# otherwise it will try to find gemini.api.key in application-secrets.properties
gemini.api.key=${GEMINI_API_KEY:}

# Security: Limit upload size to 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://pdf-prompt-scanner.vercel.app}

app.scan.max-pages=50
app.scan.rate-limit-rpm=10
# Number of proxy layers in front of the app. Render adds exactly one; set to 0
# when running the server directly, or X-Forwarded-For becomes spoofable.
app.scan.trusted-proxy-count=${TRUSTED_PROXY_COUNT:1}
