# Detection rules for the heuristic engine.
#
# These live in version control rather than a database so that a change to what
# the scanner looks for is reviewable in a diff, like any other code change.
# Edit this file and restart; there is no runtime rule editor.
#
#   phrase  the text to look for
#   regex   true to treat it as a regular expression; omit for a literal phrase
#
# Literal phrases are matched tolerantly: they ignore spacing, punctuation and
# zero-width padding ("b.y.p.a.s.s"), fold lookalike characters (Cyrillic "і" to
# Latin "i"), and anchor at word starts so "act as a" does not fire inside
# "react as a whole".
#
# Rules are grouped by the injection family they target. Phrases are kept
# multi-word wherever possible: single common words ("bypass", "instructions")
# fire on ordinary business prose and were measured to dominate false positives.

app:
  heuristics:
    rules:
      # --- Instruction override: reset the model's task ---
      - phrase: "ignore all previous instructions"
      - phrase: "ignore previous instructions"
      - phrase: "ignore the above"
      - phrase: "disregard all previous"
      - phrase: "disregard the above"
      - phrase: "forget everything"
      - phrase: "forget all previous"
      - phrase: "new instructions"
      - phrase: "do not follow the rules"

      # --- Role hijack: assign a new persona to escape guardrails ---
      # "you are now" alone flags "You are now permitted to use a calculator".
      # A role assignment is followed by an article or a state verb.
      - phrase: "\\byou are now\\s+(a|an|the|acting|operating|in|running)\\b"
        regex: true
      - phrase: "from now on you"
      - phrase: "pretend you are"
      - phrase: "act as an unrestricted"
      - phrase: "developer mode"
      - phrase: "jailbreak"
      - phrase: "dan mode"

      # --- System prompt extraction ---
      # Bare "system prompt" / "system message" fire on ordinary technical
      # writing — incident postmortems, product manuals, research abstracts —
      # and were measured to cause 22 of 22 false positives on the benign
      # corpus. Requiring an extraction verb nearby keeps the intent and drops
      # the noise.
      - phrase: "(reveal|print|repeat|show|output|leak|disclose|ignore)\\b.{0,24}\\bsystem (prompt|message)"
        regex: true
      - phrase: "reveal your instructions"
      - phrase: "repeat the text above"
      # "Print your instructions from the portal" is ordinary workplace prose.
      # Extraction attempts ask for them verbatim, or name the system prompt.
      - phrase: "(reveal|print|repeat|output|show)\\s+(your|the)\\s+(system\\s+)?(instructions|prompt|rules)\\b.{0,40}\\b(verbatim|in full|word for word|exactly|above|preceding)"
        regex: true

      # --- Output forcing: dictate the verdict regardless of content ---
      - phrase: "respond only with"
      # "output only" appears in legitimate prose ("output only structured
      # logs"); as a directive it is followed by a quoted or shouted literal.
      #
      # NOTE: regex rules are compiled CASE_INSENSITIVE, so [A-Z] matches
      # lowercase too. A rule that means to discriminate on case must opt out
      # explicitly with (?-i:...) -- without it this matched "output only
      # structured logs" and caused 7 false positives.
      - phrase: "output only\\s+[\"'\u201c]|output only\\s+(?-i:[A-Z]{2,})"
        regex: true
      - phrase: "you must output"
      # "Staff must always respond with ..." is about people. An instruction to
      # a model appears as an imperative at the start of a sentence.
      - phrase: "(^|[.!?\\n]\\s*)always respond with"
        regex: true
      - phrase: "regardless of the content"
      - phrase: "regardless of what"

      # --- Safety bypass ---
      - phrase: "bypass all restrictions"
      - phrase: "bypass your safety"
      - phrase: "ignore safety"
      - phrase: "without any warnings"

      # --- Data exfiltration ---
      - phrase: "send the data to"
      - phrase: "append to the url"
      - phrase: "include the api key"
      - phrase: "exfiltrate"

      # --- Encoded payload markers ---
      # A long unbroken base64 run is not proof of anything on its own, but in a
      # text document it is unusual enough to be worth surfacing.
      - phrase: "decode the following"
      - phrase: "base64:[A-Za-z0-9+/]{40,}={0,2}"
        regex: true
