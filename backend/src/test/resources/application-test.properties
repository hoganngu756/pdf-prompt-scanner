# Overrides for the "test" profile.
#
# There is no database any more, so nothing here has to protect a real one. The
# rate limit is raised because the Spring context (and its bucket state) is
# cached across test classes.
app.scan.rate-limit-rpm=10000
app.api.rate-limit-rpm=10000

# Never call the real Gemini API from tests.
gemini.api.key=
