# Overrides for the "test" profile.
#
# Without this file the profile falls back to application.properties, so the
# suite runs against the real scanner-history.db. ScanControllerTest.cleanDb()
# then deletes every heuristic rule, and because BackendApplication only seeds
# defaults when the table is empty, the leftover test row stops them ever
# coming back -- leaving the scanner with no active rules.
spring.datasource.url=jdbc:sqlite:target/test-scanner-history.db
spring.jpa.hibernate.ddl-auto=create-drop

# Fixed key so the admin-auth tests pass without the gitignored secrets file.
app.admin.api-key=test-admin-secret-key

# Never call the real Gemini API from tests.
gemini.api.key=

# The rate limiter now covers /api/**, and the Spring context (and its bucket
# state) is cached across test classes. A high ceiling keeps the suite from
# going flaky as tests are added.
app.scan.rate-limit-rpm=10000
